# Same name and pull_request triggers as NightPDF's pull.yaml. Pushes to main
# run it too so main itself shows whether it builds.
name: Pull Request
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      # keep vcpkg's built libraries between runs (gtest, spdlog, ...)
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v7
      - name: cache nuget packages
        uses: actions/cache@v6
        with:
          path: packages
          key: nuget-${{ hashFiles('app/packages.config') }}
      - name: cache vcpkg builds
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json') }}
      - name: make vcpkg cache dir
        run: New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
      - name: format
        if: matrix.platform == 'x64'
        run: ./scripts/format.ps1 -Check
      - name: build
        run: ./scripts/build.ps1 -Config Release -Platform ${{ matrix.platform }}
      # the runner is x64, so ARM64 only gets built, not run
      - name: test
        if: matrix.platform == 'x64'
        run: ./scripts/test.ps1 -Config Release -Platform x64
